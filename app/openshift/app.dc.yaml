apiVersion: template.openshift.io/v1
objects:
- apiVersion: image.openshift.io/v1
  kind: ImageStream
  metadata:
    labels:
      shared: "true"
    creationTimestamp: null
    generation: 0
    name: ${NAME}
  spec:
    lookupPolicy:
      local: false
  status:
    dockerImageRepository: null
- apiVersion: apps/v1
  kind: Deployment
  metadata:
    creationTimestamp: null
    generation: 0
    labels: null
    name: ${NAME}${SUFFIX}
  spec:
    replicas: "${{REPLICAS}}"
    revisionHistoryLimit: 10
    selector:
      deployment: ${NAME}${SUFFIX}
    strategy:
      activeDeadlineSeconds: 21600
      recreateParams:
        timeoutSeconds: 600
      resources: 
        limits:
          cpu: ${CPU_LIMIT}
          memory: ${MEMORY_LIMIT}
        requests:
          cpu: ${CPU_REQUEST}
          memory: ${MEMORY_REQUEST}
      type: RollingUpdate
    template:
      metadata:
        annotations: null
        creationTimestamp: null
        labels:
          deployment: ${NAME}${SUFFIX}
      spec:
        containers:
        - env:
          - name: CHANGE_VERSION
            value: ${CHANGE_ID}
          - name: API_HOST
            value: ${API_HOST}
          - name: ENVIRONMENT
            value: ${ENVIRONMENT}
          - name: VERSION
            value: ${VERSION}
          - name: SSO_URL
            value: ${SSO_URL}
          - name: SSO_CLIENT_ID
            value: ${SSO_CLIENT_ID}
          - name: SSO_REALM
            value: ${SSO_REALM}
          image: " "
          imagePullPolicy: Always
          name: app
          ports:
          - containerPort: ${{APP_PORT_DEFAULT}}
            protocol: TCP
          - containerPort: ${{APP_PORT_OTHER}}
            protocol: TCP
          resources: 
            limits:
              cpu: ${CPU_LIMIT}
              memory: ${MEMORY_LIMIT}
            requests:
              cpu: ${CPU_REQUEST}
              memory: ${MEMORY_REQUEST}
          readinessProbe:
            failureThreshold: 10
            httpGet:
              path: /healthcheck
              port: ${{APP_PORT_DEFAULT}}
              scheme: HTTP
            initialDelaySeconds: 65
            periodSeconds: 20
            successThreshold: 1
            timeoutSeconds: 20
          livenessProbe:
            failureThreshold: 10
            httpGet:
              path: /healthcheck
              port: ${{APP_PORT_DEFAULT}}
              scheme: HTTP
            initialDelaySeconds: 65
            periodSeconds: 30
            successThreshold: 1
            timeoutSeconds: 20
          terminationMessagePath: /dev/termination-log
          terminationMessagePolicy: File
        dnsPolicy: ClusterFirst
        restartPolicy: Always
        schedulerName: default-scheduler
        securityContext: {}
        terminationGracePeriodSeconds: 30
        volumes:
        - emptyDir: {}
          name: ${NAME}${SUFFIX}
    test: false
  status:
    availableReplicas: 0
    latestVersion: 0
    observedGeneration: 0
    replicas: 0
    unavailableReplicas: 0
    updatedReplicas: 0
- apiVersion: v1
  kind: Service
  metadata:
    creationTimestamp: null
    labels: {}
    name: ${NAME}${SUFFIX}
  spec:
    ports:
    - name: ${NAME}-${APP_PORT_DEFAULT_NAME}
      port: ${{APP_PORT_DEFAULT}}
      protocol: TCP
      targetPort: ${{APP_PORT_DEFAULT}}
    - name: ${NAME}-${APP_PORT_OTHER_NAME}
      port: ${{APP_PORT_OTHER}}
      protocol: TCP
      targetPort: ${{APP_PORT_OTHER}}
    selector:
      deployment: ${NAME}${SUFFIX}
    sessionAffinity: None
    type: ClusterIP
  status:
    loadBalancer: {}
- apiVersion: route.openshift.io/v1
  kind: Route
  metadata:
    creationTimestamp: null
    labels: {}
    name: ${NAME}${SUFFIX}
  spec:
    host: ${HOST}
    tls:
      insecureEdgeTerminationPolicy: Redirect
      termination: edge
    port:
      targetPort: ${NAME}-${APP_PORT_DEFAULT_NAME}
    to:
      kind: Service
      name: ${NAME}${SUFFIX}
      weight: 100
    wildcardPolicy: None
  status:
    ingress: null
- apiVersion: autoscaling/v1
  kind: HorizontalPodAutoscaler
  metadata:
    creationTimestamp: null
    labels: {}
    name: ${NAME}${SUFFIX}
  spec:
    maxReplicas: "${{REPLICA_MAX}}"
    minReplicas: "${{REPLICAS}}"
    scaleTargetRef:
      apiVersion: v1
      kind: Deployment
      name: ${NAME}${SUFFIX}
    cpuUtilization:
      targetPercentage: 95
kind: Template
metadata:
  resourceVersion: ""
  selfLink: ""
parameters:
- name: NAME
  value: invasivebc-app
- name: SUFFIX
  value: "dev"
- name: VERSION
  value: "1.0"
- name: HOST
- name: CHANGE_ID
  value: "0"
- name: API_HOST
  description: API host for application backend
  value: ""
- name: ENVIRONMENT
  description: ENVIRONMENT specification variable
  value: 'dev'
- name: APP_PORT_DEFAULT
  description: Application default port
  value: '3030'
- name: APP_PORT_DEFAULT_NAME
  description: Default port resource name
  value: '3030-tcp'
- name: APP_PORT_OTHER
  description: Other reserved port of the application
  value: '8088'
- name: APP_PORT_OTHER_NAME
  description: Other reserved port resource name
  value: '8088-tcp'
- name: CPU_REQUEST
  description: CPU REQUEST for deployment config
  value: '200m'
- name: CPU_LIMIT
  description: CPU LIMIT for dc
  value: '500m'
- name: MEMORY_REQUEST
  description: MEMORY REQUEST for dc
  value: '1Gi'
- name: MEMORY_LIMIT
  description: MEMORY LIMIT for dc
  value: '2Gi'
- name: SSO_URL
  description: Key clock login url
  value: 'https://loginproxy.gov.bc.ca'
- name: SSO_CLIENT_ID
  description: Client Id for application
  value: "inspect-bc-mussels-4817"
- name: SSO_REALM
  description: Realm identifier or name
  value: standard
- name: REPLICAS
  value: '1'
- name: REPLICA_MAX
  required: true
  value: '1'
